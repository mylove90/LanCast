plugins { id 'com.android.application' }

android {
    namespace 'com.lancast.phone'
    compileSdk 35

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    defaultConfig {
        applicationId 'com.lancast.phone'
        minSdk 29
        targetSdk 35
        versionCode 1
        versionName '0.1-alpha'
    }
}
