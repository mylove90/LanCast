
name: Build LanCast APKs

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build Android APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug APKs
        run: gradle --no-daemon assembleDebug

      - name: Prepare APK files
        run: |
          mkdir -p release-apks
          cp tvreceiver/build/outputs/apk/debug/*.apk release-apks/LanCast-TV-Receiver.apk
          cp phonesender/build/outputs/apk/debug/*.apk release-apks/LanCast-Phone-Sender.apk

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LanCast-APKs
          path: release-apks/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release-apks/*.apk
          generate_release_notes: true

