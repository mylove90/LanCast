name: Build LanCast APKs

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APKs
        run: gradle --no-daemon assembleDebug
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: lancast-debug-apks
          path: |
            tvreceiver/build/outputs/apk/debug/*.apk
            phonesender/build/outputs/apk/debug/*.apk
          if-no-files-found: error
