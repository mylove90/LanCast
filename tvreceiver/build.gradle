plugins { id 'com.android.application' }

android {
    namespace 'com.lancast.tv'
    compileSdk 35

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    defaultConfig {
        applicationId 'com.lancast.tv'
        minSdk 19
        targetSdk 28
        versionCode 1
        versionName '0.1-alpha'
    }
}
